<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard1.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/login.css')}}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/user.css')}}">
</head>

<body>
    <div class="nav">
        <h1 class="logo">NoteHub</h1>
        <button class="menu-toggle" id="menuToggle">☰</button>
        <ul class="menu" id="navMenu">
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('register') }}">register</a></li>
        </ul>
    </div>
        
        <div class="login-page">
              <div class="login-box">
                 <div class="login-lebal">
                    <h1>Welcome Back</h1>
                    <p>sign in to your account to continue</p>
                 </div>
                 <form action="/login1" method="POST" >
                 <div class="log-info">
            

                    <h1> Username or Email</h1>
                    <input class="log-inp" name="username" type="text" placeholder="Enter your username or email" required>
                    <h1>Password</h1>
                    <input class="log-inp" name="password" type="password" placeholder="Enter your password" required>
                    <h1>Select Role</h1>
                    <div class="role-selector">
                        <label class="role-option">
                            <input type="radio" name="role" value="student">
                            <span class="role-label">Student</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="teacher">
                            <span class="role-label">Teacher</span>
                        </label>
                    </div>
                    <input type="submit" value="Submit" class="btn">
                    <p class="pp">you don't have account?<a href="/register">register</a></p>
                 </div>
                 </form>
              </div>
        </div>
        <footer>
            <p>@sdhj</p>
        </footer>
        <script>
            const menuToggle = document.getElementById('menuToggle');
            const navMenu = document.getElementById('navMenu');
            
            if (menuToggle) {
                menuToggle.addEventListener('click', () => {
                    navMenu.classList.toggle('active');
                });
            }
            
            document.querySelectorAll('.menu a').forEach(link => {
                link.addEventListener('click', () => {
                    if (navMenu) navMenu.classList.remove('active');
                });
            });
        </script>
</body>

</html>
